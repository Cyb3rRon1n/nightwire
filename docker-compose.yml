name: nightwire

# Self-hosted Nightwire stack: game server + web frontend.
#   docker compose up -d --build
#
# Local narrator (Ollama) instead of a hosted model:
#   docker compose --profile ollama up -d --build
#   docker compose exec ollama ollama pull "${NIGHTWIRE_MODEL:-qwen3:8b}"
#   ...and in .env: OLLAMA_HOST=http://ollama:11434
#
# Already run Anvil on this host? Point OLLAMA_HOST at Anvil's Ollama
# instead of the profile above — one GPU can't usefully feed two Ollamas.
#
# Scene/portrait image generation (narrator/image_backend.py). Two backends:
#   IMAGE_BACKEND=flux_worker (default) talks to open-dungeon's
#     ultra-fast-image-gen worker, which is MLX-based (Apple Silicon only) —
#     it can't run in this Linux container stack. Set FLUX_WORKER_URL if you
#     run that worker natively on a Mac reachable from this host; there's no
#     shared-volume wiring here for its output, so generated images won't
#     reach the web frontend without more plumbing.
#   IMAGE_BACKEND=comfyui talks to a real ComfyUI instance over plain HTTP —
#     no MLX/Apple-Silicon dependency, no shared-volume issue. Set
#     COMFYUI_URL to a reachable ComfyUI instance and it works directly from
#     this container. COMFYUI_PROFILE=noobai (default) | sd15; noobai needs
#     NoobAI-XL-Vpred-v1.0.safetensors + Smooth_Booster_v3.safetensors (LoRA)
#     on the ComfyUI host. COMFYUI_LORA=none disables the LoRA.
#
# TTS (Kokoro) is real and containerizable — enable with --profile voice.

services:
  server:
    build:
      context: .
      dockerfile: Dockerfile
    image: nightwire-server
    restart: unless-stopped
    environment:
      NIGHTWIRE_MODEL: ${NIGHTWIRE_MODEL:-qwen3:8b}
      OLLAMA_HOST: ${OLLAMA_HOST:-}
      FLUX_WORKER_URL: ${FLUX_WORKER_URL:-}
      IMAGE_BACKEND: ${IMAGE_BACKEND:-flux_worker}
      COMFYUI_URL: ${COMFYUI_URL:-http://192.168.10.19:8188}
      COMFYUI_CHECKPOINT: ${COMFYUI_CHECKPOINT:-}
      COMFYUI_PROFILE: ${COMFYUI_PROFILE:-}
      COMFYUI_LORA: ${COMFYUI_LORA:-}
      COMFYUI_LORA_STRENGTH: ${COMFYUI_LORA_STRENGTH:-}
      COMFYUI_SAMPLER: ${COMFYUI_SAMPLER:-}
      COMFYUI_SCHEDULER: ${COMFYUI_SCHEDULER:-}
      COMFYUI_CFG: ${COMFYUI_CFG:-}
      KOKORO_URL: ${KOKORO_URL:-http://kokoro:8880}
      NARRATOR_BACKEND: ${NARRATOR_BACKEND:-ollama}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      NARRATOR_ANTHROPIC_MODEL: ${NARRATOR_ANTHROPIC_MODEL:-}
      NARRATOR_OPENAI_COMPAT_BASE_URL: ${NARRATOR_OPENAI_COMPAT_BASE_URL:-}
      NARRATOR_OPENAI_COMPAT_MODEL: ${NARRATOR_OPENAI_COMPAT_MODEL:-}
      NARRATOR_OPENAI_COMPAT_API_KEY: ${NARRATOR_OPENAI_COMPAT_API_KEY:-}
    volumes:
      - sessions:/data/sessions
    ports:
      - "${SERVER_PORT:-8000}:8000"

  web:
    build:
      context: frontend
      dockerfile: Dockerfile
    image: nightwire-web
    restart: unless-stopped
    environment:
      OLLAMA_BASE_URL: ${OLLAMA_HOST:-http://127.0.0.1:11434}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
    ports:
      - "${WEB_PORT:-3000}:3000"

  # Local narrator. Only starts with --profile ollama.
  ollama:
    image: ollama/ollama:latest
    profiles: ["ollama"]
    restart: unless-stopped
    volumes:
      - ollama:/root/.ollama
    # NVIDIA GPU (needs the NVIDIA Container Toolkit on the host — without
    # it Ollama silently runs on CPU). Uncomment to enable:
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

  # Character-distinct TTS narration. Only starts with --profile voice.
  kokoro:
    image: ghcr.io/remsky/kokoro-fastapi-cpu:latest
    profiles: ["voice"]
    restart: unless-stopped

volumes:
  sessions:
  ollama:
