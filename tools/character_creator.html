<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Create a character</title>
<style>
:root{color-scheme:dark;--bg:#07060d;--panel:#14111d;--panel2:#1d1829;--text:#ece7f5;--dim:#aba3bd;--line:#3fd5ff55;--pink:#ff4fa3;--cyan:#3fd5ff;--bad:#ff8a8a;--good:#7be495}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--text);font:16px/1.5 system-ui,sans-serif;margin:0;overflow-wrap:anywhere}
a{color:var(--cyan)}
header{padding:14px 16px;border-bottom:1px solid var(--line)}
header h1{margin:0;font-size:1.3rem;color:var(--pink)}
main{padding:16px;max-width:1200px;margin:0 auto 48px}
h2{font-size:1.15rem;margin:24px 0 8px}
.panel{background:var(--panel);border:1px solid #ffffff14;border-radius:10px;padding:16px;margin:12px 0}
.narrow{max-width:640px}
.dim{color:var(--dim)}
.small{font-size:.875rem}
.steps{display:flex;flex-wrap:wrap;gap:4px 8px;list-style:none;margin:0 0 16px;padding:0}
.steps li{color:var(--dim);border-bottom:3px solid #ffffff22;padding:2px 6px;font-size:.875rem}
.steps li[aria-current]{color:var(--text);border-color:var(--pink);font-weight:700}
.steps li.done{border-color:var(--cyan)}
.field{margin:0 0 14px}
label,.label{display:block;font-weight:600;font-size:.9rem;margin-bottom:4px}
input[type=text],select,textarea{width:100%;background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:6px;padding:8px 10px;font:16px system-ui,sans-serif;min-height:44px}
textarea{min-height:72px;resize:vertical}
.choices{display:flex;flex-wrap:wrap;gap:8px 16px}
.choices label{display:flex;align-items:center;gap:6px;font-weight:400;margin:0;min-height:44px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}
button{font:600 15px system-ui,sans-serif;min-height:44px;background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:6px;padding:0 14px;cursor:pointer}
button:hover:not(:disabled){border-color:var(--cyan)}
button:disabled{opacity:.5;cursor:default}
button.go{background:var(--pink);border-color:var(--pink);color:#07060d}
button.on{background:var(--cyan);border-color:var(--cyan);color:#07060d}
button.danger{color:var(--bad);border-color:var(--bad)}
:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
.msg{min-height:1.5em;margin:10px 0 0}
.msg.err{color:var(--bad);font-weight:600}
.status{border-left:4px solid var(--cyan);padding:8px 12px;background:var(--panel);margin:12px 0}
.status.err{border-color:var(--bad)}
.status.good{border-color:var(--good)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,260px),1fr));gap:12px}
figure{margin:0;background:var(--panel);border:2px solid transparent;border-radius:8px;overflow:hidden}
figure.picked{border-color:var(--pink)}
figure img{display:block;width:100%;height:auto;background:#000}
figcaption{padding:8px}
figcaption .row{margin-top:0}
figcaption button{padding:0 10px;font-size:.875rem}
.faces{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
@media (max-width:560px){.faces{grid-template-columns:repeat(2,minmax(0,1fr))}}
.sheet{margin:0 0 16px}
dl{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,2fr);gap:2px 12px;margin:8px 0}
dt{color:var(--dim);font-size:.875rem}
dd{margin:0}
ul.people{list-style:none;margin:0;padding:0}
ul.people li{padding:8px 0;border-bottom:1px solid #ffffff14}
</style>
</head>
<body>
<header><h1 id="title">Create a character</h1></header>
<main id="app"><p class="dim">Loading...</p></main>
<script>
"use strict";
const API = "/create/api";
const DELETE_WORDING = "Delete this character? This removes it and its images from the creator for good. Copies may remain in the image generator until they're cleaned up.";
const STEPS = [["basics", "Basics"], ["look", "Look"], ["nightwire", "Nightwire details"], ["final", "Final touches"]];
const app = document.getElementById("app");
const titleEl = document.getElementById("title");

const here = location.pathname;
const ownerMatch = here.match(/^\/create\/owner\/([^/]+)(?:\/new\/(npc|ai)|\/c\/([^/]+))?\/?$/);
const playerMatch = here.match(/^\/create\/c\/([^/]+)\/?$/);
const owner = ownerMatch ? ownerMatch[1] : null;
const base = owner ? `${API}/owner/${owner}` : API;
const pages = owner ? `/create/owner/${owner}` : "/create";

let options = null;
let current = null;   // the character on screen
let shownKey = "";
let timer = null;
let varying = null;   // name of the image whose "Like this one, but..." panel is open
let confirming = null;   // "lock" or "delete" while the page is asking
let declining = null;
const typed = {reroll: "", vary: "", strength: "subtle", decline: ""};   // survives a redraw

// Every value goes in through textContent or a property, so nothing a player typed can become markup.
function el(tag, props, ...children) {
  const node = document.createElement(tag);
  for (const [key, value] of Object.entries(props || {})) {
    if (key === "class") node.className = value;
    else if (key === "text") node.textContent = value;
    else if (key === "onclick") node.addEventListener("click", value);
    else if (key === "oninput") node.addEventListener("input", value);
    else if (key.startsWith("aria-") || key === "for" || key === "role") node.setAttribute(key, value);
    else node[key] = value;
  }
  node.append(...children.filter(c => c !== null && c !== undefined));
  return node;
}

async function api(method, path, body) {
  const init = {method, headers: {"Content-Type": "application/json"}};
  if (method !== "GET") init.body = JSON.stringify(body || {});
  let response;
  try {
    response = await fetch(base + path, init);
  } catch (e) {
    throw new Error("Couldn't reach the server. Check your connection and try again.");
  }
  const data = await response.json().catch(() => ({}));
  if (!response.ok) {
    const error = new Error(data.error || `The server answered ${response.status}.`);
    error.status = response.status;
    throw error;
  }
  return data;
}

function say(node, text, isError) {
  node.textContent = text;
  node.className = "msg" + (isError ? " err" : "");
}

function answerList(answers) {
  const list = el("dl");
  for (const q of options.questions) {
    const value = answers[q.id];
    if (value && value.length) list.append(el("dt", {text: q.label}), el("dd", {text: Array.isArray(value) ? value.join(", ") : value}));
  }
  return list;
}

/* ---------- The form ---------- */

function showForm({kind, answers, intro, submitLabel, onSubmit}) {
  const values = {...answers};
  const worldly = kind === "npc" || kind === "ai";
  const questions = options.questions.filter(q => !q.world_only || worldly);
  let step = 0;

  function field(q) {
    const id = `q-${q.id}`;
    if (q.kind === "multi") {
      const chosen = new Set(values[q.id] || []);
      return el("fieldset", {class: "field", style: "border:0;padding:0"},
        el("legend", {class: "label", text: q.label}),
        el("div", {class: "choices"}, ...q.choices.map((c, i) => {
          const box = el("input", {type: "checkbox", id: `${id}-${i}`, checked: chosen.has(c)});
          box.addEventListener("change", () => {
            if (box.checked) chosen.add(c); else chosen.delete(c);
            values[q.id] = [...chosen];
          });
          return el("label", {for: box.id}, box, el("span", {text: c}));
        })));
    }
    let input;
    if (q.kind === "choice") {
      input = el("select", {id, required: q.required},
        q.required ? el("option", {value: "", text: "Choose one"}) : el("option", {value: "", text: "No preference"}),
        ...q.choices.map(c => el("option", {value: c, text: c})));
    } else {
      input = el("input", {type: "text", id, maxLength: q.max || 120, required: q.required});
    }
    input.value = values[q.id] || "";
    input.addEventListener("input", () => { values[q.id] = input.value; });
    return el("div", {class: "field"},
      el("label", {for: id, text: q.label + (q.required ? " (required)" : "")}), input,
      q.hint ? el("p", {class: "dim small", text: q.hint, style: "margin:4px 0 0"}) : null);
  }

  const message = el("p", {class: "msg", role: "alert"});

  function draw() {
    const [stepId, stepName] = STEPS[step];
    const missing = () => questions.filter(q => q.step === stepId && q.required && !values[q.id]);
    const next = el("button", {type: "submit", class: "go", text: step === STEPS.length - 1 ? submitLabel : "Next"});
    const back = step ? el("button", {type: "button", text: "Back", onclick: () => { step--; draw(); }}) : null;
    const form = el("form", {class: "panel narrow", noValidate: true},
      el("ol", {class: "steps", "aria-label": `Step ${step + 1} of ${STEPS.length}`},
        ...STEPS.map(([, name], i) => el("li", {text: name, class: i < step ? "done" : "", ...(i === step ? {"aria-current": "step"} : {})}))),
      el("h2", {text: stepName, style: "margin-top:0"}),
      step === 0 ? el("p", {class: "dim small", text: "Only name and presentation are required. For describing, short phrases separated by commas work best."}) : null,
      ...questions.filter(q => q.step === stepId).map(field),
      el("div", {class: "row"}, back, next),
      message);
    form.addEventListener("submit", async e => {
      e.preventDefault();
      const gaps = missing();
      if (gaps.length) return say(message, `Please fill in: ${gaps.map(q => q.label.toLowerCase()).join(", ")}.`, true);
      say(message, "");
      if (step < STEPS.length - 1) { step++; return draw(); }
      next.disabled = true;
      say(message, "One moment...");
      try {
        await onSubmit(values);
      } catch (error) {
        // The answers stay: `values` isn't touched, and the form stays up so the words can be changed.
        say(message, error.message, true);
        next.disabled = false;
      }
    });
    app.replaceChildren(...intro, form);
    const first = form.querySelector("input,select");
    if (first) first.focus();
  }
  draw();
}

function newCharacterForm(kind, isSuggestion) {
  const intro = [];
  if (isSuggestion) {
    titleEl.textContent = kind === "ai" ? "Suggest an AI character" : "Suggest an NPC";
    intro.push(el("p", {text: "Nothing is drawn until the owner reviews your suggestion. You'll get a private link to see the outcome."}),
      el("p", {}, el("a", kind === "ai" ? {href: "/create/?suggest=npc", text: "Suggest an NPC instead"} : {href: "/create/?suggest=ai", text: "Suggest an AI character instead"})));
  } else if (owner) {
    titleEl.textContent = kind === "ai" ? "New AI character" : "New NPC";
  } else {
    intro.push(el("p", {text: "Describe your character, and four candidates will be drawn for you. You can redo them as often as you like."}));
  }
  showForm({
    kind, answers: {}, intro, submitLabel: isSuggestion ? "Send suggestion" : "Create and draw candidates",
    onSubmit: async values => {
      const made = await api("POST", "/characters", {kind, answers: values});
      if (!isSuggestion) {
        try {
          await api("POST", `/characters/${made.id}/generate`);
        } catch (e) { /* the review page offers Generate: the character and its link already exist */ }
      }
      location.assign(`${pages}/c/${made.id}`);
    },
  });
}

/* ---------- One character ---------- */

const imageUrl = (name, version) => `${base}/characters/${current.id}/image/${name}` + (version ? `?v=${encodeURIComponent(version)}` : "");
const isActive = record => Boolean(record.queue && record.queue.position !== null);
const canChange = record => owner || record.kind === "player";

// Everything but the place in line: a new place doesn't need a redraw that loses what someone's typing.
function keyOf(record) {
  return JSON.stringify({...record, queue: record.queue && {active: isActive(record), error: record.queue.error, label: record.queue.label}});
}

function queueLine(record) {
  const q = record.queue;
  if (!q) return null;
  if (q.position === null) return el("div", {class: "status err"}, el("span", {text: `This batch failed: ${q.error} Earlier rounds are untouched.`}),
    el("div", {class: "row"}, el("button", {text: "Retry", onclick: () => act(() => api("POST", `/characters/${record.id}/retry`))})));
  const place = q.position === 1 ? "next in line, or drawing now" : `number ${q.position} in line`;
  return el("div", {class: "status", id: "line", text: `Your ${q.label}: ${place}. If the GPU is busy with something else, this waits for it. This page updates by itself.`});
}

async function act(fn) {
  const message = document.getElementById("message");
  try {
    const record = await fn();
    if (record && record.id) current = record;
    await refresh(true);
    const after = document.getElementById("message");
    if (after) { say(after, ""); after.focus(); }
  } catch (error) {
    if (message) say(message, error.message, true);
  }
}

function card(record, name, round, n) {
  const path = `/characters/${record.id}`;
  const open = varying === name;
  const locked = record.status === "locked";
  const busy = isActive(record);
  const isPicked = record.picked === name;
  const isFav = record.favourites.includes(name);
  const actions = el("div", {class: "row"});
  if (canChange(record)) {
    if (!locked) actions.append(el("button", {text: isPicked ? "Picked" : "Pick", class: isPicked ? "on" : "", "aria-pressed": String(isPicked),
      onclick: () => act(() => api("POST", `${path}/pick`, {round, n}))}));
    actions.append(el("button", {text: isFav ? "Favourited" : "Favourite", class: isFav ? "on" : "", "aria-pressed": String(isFav),
      onclick: () => act(() => api("POST", `${path}/favourite`, {round, n}))}));
    if (!locked) actions.append(el("button", {text: "Like this one, but...", "aria-expanded": String(open),
      onclick: () => { varying = open ? null : name; draw(); }}));
  }
  const figure = el("figure", {class: isPicked ? "picked" : ""},
    el("img", {src: imageUrl(name), alt: `${record.answers.name}, round ${round}, candidate ${n}`, loading: "lazy"}),
    el("figcaption", {}, actions));
  if (open) {
    const noteId = `vary-note-${round}-${n}`;
    const legend = `strength-${round}-${n}`;
    const note = el("input", {type: "text", id: noteId, maxLength: 200, value: typed.vary, oninput: e => { typed.vary = e.target.value; }});
    figure.querySelector("figcaption").append(
      el("fieldset", {style: "border:0;margin:10px 0 0;padding:0"},
        el("legend", {class: "label", text: "How different?"}),
        el("div", {class: "choices"}, ...options.strengths.map(s => el("label", {},
          el("input", {type: "radio", name: legend, value: s, checked: typed.strength === s, onclick: () => { typed.strength = s; }}),
          el("span", {text: s === "subtle" ? "Subtle" : "Strong"}))))),
      el("div", {class: "field", style: "margin:8px 0 0"}, el("label", {for: noteId, text: "What should change? (optional)"}), note),
      el("div", {class: "row"}, el("button", {class: "go", text: "Make variations", disabled: busy,
        onclick: () => act(async () => {
          const made = await api("POST", `${path}/vary`, {round, n, strength: typed.strength, note: typed.vary});
          varying = null;
          typed.vary = "";
          return made;
        })})));
  }
  return figure;
}

function roundOf(record, name) {
  for (const r of record.rounds) {
    const at = r.images.indexOf(name);
    if (at >= 0) return [r.n, at + 1];
  }
  return null;
}

function sheetsPanel(record) {
  const path = `/characters/${record.id}`;
  const busy = isActive(record);
  const version = record.updated;
  const redo = sheet => canChange(record) ? el("button", {text: "Redo", disabled: busy,
    onclick: () => act(() => api("POST", `${path}/sheet`, {sheet}))}) : null;
  const pending = el("p", {class: "dim", text: "Waiting to be drawn."});
  const single = (sheet, title) => el("section", {class: "sheet"},
    el("h3", {text: title}),
    record.sheets[sheet] ? el("img", {src: imageUrl(record.sheets[sheet], version), alt: `${record.answers.name}: ${title}`, style: "width:100%;height:auto;display:block"}) : pending.cloneNode(true),
    el("div", {class: "row"}, redo(sheet)));
  const faces = record.sheets.expressions.length
    ? el("div", {class: "faces"}, ...record.sheets.expressions.map((name, i) => el("figure", {},
        el("img", {src: imageUrl(name, version), alt: `${record.answers.name}: ${options.expressions[i]}`, loading: "lazy"}),
        el("figcaption", {class: "small", text: options.expressions[i]}))))
    : pending.cloneNode(true);
  return el("section", {},
    el("h2", {text: "Your character's sheets"}),
    single("turnaround", "Turnaround"),
    el("section", {class: "sheet"}, el("h3", {text: "Expressions"}), faces, el("div", {class: "row"}, redo("expressions"))),
    single("colorguide", "Colour guide"));
}

function toolbar(record) {
  const path = `/characters/${record.id}`;
  const busy = isActive(record);
  const parts = [];
  if (record.status !== "locked") {
    const noteId = "reroll-note";
    parts.push(el("div", {class: "field"}, el("label", {for: noteId, text: "Note for the next four (optional)"}),
      el("input", {type: "text", id: noteId, maxLength: 200, value: typed.reroll, oninput: e => { typed.reroll = e.target.value; }})));
    const row = el("div", {class: "row"},
      el("button", {class: "go", disabled: busy, text: record.rounds.length ? "Reroll: four new candidates" : "Draw candidates",
        onclick: () => act(async () => {
          const made = await api("POST", `${path}/generate`, {note: typed.reroll});
          typed.reroll = "";
          return made;
        })}),
      el("button", {text: "Edit answers", onclick: () => editAnswers(record)}));
    if (record.picked) row.append(el("button", {text: "Lock in", disabled: busy, onclick: () => { confirming = "lock"; draw(); }}));
    parts.push(row);
    if (!record.picked && record.rounds.length) parts.push(el("p", {class: "dim small", text: "Pick a candidate to be able to lock in. Earlier rounds can be picked too."}));
  }
  if (confirming === "lock") {
    parts.push(el("div", {class: "status", role: "group", "aria-label": "Confirm lock in"},
      el("p", {style: "margin:0", text: "Lock in this character? You can't change the answers or the pick afterwards, though each sheet can be redone."}),
      record.lock_warning ? el("p", {style: "margin:8px 0 0;font-weight:600", text: record.lock_warning}) : null,
      el("div", {class: "row"},
        el("button", {class: "go", text: "Yes, lock in", onclick: () => { confirming = null; act(() => api("POST", `${path}/lock`)); }}),
        el("button", {text: "Not yet", onclick: () => { confirming = null; draw(); }}))));
  }
  parts.push(el("div", {class: "row"}, el("button", {class: "danger", text: "Delete character", onclick: () => { confirming = "delete"; draw(); }})));
  if (confirming === "delete") {
    parts.push(el("div", {class: "status err", role: "group", "aria-label": "Confirm delete"},
      el("p", {style: "margin:0", text: DELETE_WORDING}),
      el("div", {class: "row"},
        el("button", {class: "danger", text: "Yes, delete it", onclick: async () => {
          try {
            await api("DELETE", path);
            location.assign(owner ? `${pages}/` : "/create/");
          } catch (error) {
            say(document.getElementById("message"), error.message, true);
          }
        }}),
        el("button", {text: "Keep it", onclick: () => { confirming = null; draw(); }}))));
  }
  return el("div", {class: "panel"}, ...parts);
}

function editAnswers(record) {
  stopPolling();
  shownKey = "";
  showForm({
    kind: record.kind, answers: record.answers, intro: [el("p", {text: "Change what you like. Earlier rounds stay available."})],
    submitLabel: "Save and draw new candidates",
    onSubmit: async values => {
      current = await api("PUT", `/characters/${record.id}/answers`, values);
      await api("POST", `/characters/${record.id}/generate`);
      await refresh(true);
    },
  });
}

function suggestionPanel(record) {
  const words = {
    suggested: ["Waiting for review. Nothing is drawn until the owner looks at it.", ""],
    accepted: ["Accepted! The owner takes it from here.", "good"],
    declined: ["Declined.", "err"],
    draft: ["The owner has this in hand.", ""],
    locked: ["Finished and locked in.", "good"],
  }[record.status];
  return el("div", {},
    el("div", {class: "status " + words[1]}, el("span", {text: words[0]}),
      record.status === "declined" && record.note ? el("p", {style: "margin:6px 0 0", text: `The owner says: ${record.note}`}) : null),
    el("p", {class: "dim small", text: "Bookmark this page: it's your private link to this suggestion."}),
    el("div", {class: "panel"}, el("h2", {text: "What you suggested", style: "margin-top:0"}), answerList(record.answers)));
}

function reviewPanel(record) {
  const path = `/characters/${record.id}`;
  if (record.status === "suggested" || record.status === "declined") {
    const noteId = "decline-note";
    return el("div", {},
      el("div", {class: "status " + (record.status === "declined" ? "err" : ""), text: record.status === "declined" ? `Declined. Note: ${record.note || "(none)"}` : "A suggestion waiting for your review."}),
      el("div", {class: "panel"}, answerList(record.answers),
        record.status === "suggested" ? el("div", {},
          el("div", {class: "row"},
            el("button", {class: "go", text: "Accept", onclick: () => act(() => api("POST", `${path}/accept`))}),
            el("button", {text: "Edit answers", onclick: () => editSuggestion(record)})),
          el("div", {class: "field", style: "margin-top:12px"}, el("label", {for: noteId, text: "Note for the player"}),
            el("input", {type: "text", id: noteId, maxLength: 500, value: typed.decline, oninput: e => { typed.decline = e.target.value; }})),
          el("button", {class: "danger", text: "Decline", onclick: () => act(() => api("POST", `${path}/decline`, {note: typed.decline}))})) : null));
  }
  const parts = [toolbar(record)];
  if (record.status === "locked") parts.push(sheetsPanel(record));
  for (const round of [...record.rounds].reverse()) {
    const how = round.type === "vary" ? "variations" : "candidates";
    parts.push(el("h2", {text: `Round ${round.n}: ${how}` + (round.note ? ` (${round.note})` : "")}),
      el("div", {class: "grid"}, ...round.images.map((name, i) => card(record, name, round.n, i + 1))));
  }
  const favourites = record.favourites.map(name => [name, roundOf(record, name)]).filter(([, at]) => at);
  if (favourites.length) {
    parts.push(el("h2", {text: "Favourites"}),
      el("div", {class: "grid"}, ...favourites.map(([name, at]) => el("figure", {class: record.picked === name ? "picked" : ""},
        el("img", {src: imageUrl(name), alt: `${record.answers.name}: favourite from round ${at[0]}`, loading: "lazy"}),
        el("figcaption", {class: "small dim", text: `Round ${at[0]}, candidate ${at[1]}`})))));
  }
  return el("div", {}, ...parts);
}

function editSuggestion(record) {
  stopPolling();
  shownKey = "";
  showForm({
    kind: record.kind, answers: record.answers, intro: [], submitLabel: "Save",
    onSubmit: async values => {
      current = await api("PUT", `/characters/${record.id}/answers`, values);
      await refresh(true);
    },
  });
}

function draw() {
  const record = current;
  titleEl.textContent = record.answers.name;
  shownKey = keyOf(record);
  const readOnly = !canChange(record);
  const notice = owner ? el("p", {class: "dim small"}, el("a", {href: `${pages}/`, text: "Back to all characters"}))
    : readOnly ? null : el("p", {class: "status", text: "Bookmark this page. It's your private link to this character, and there's no other way back without asking the owner. Don't share it: anyone with the link can change the character."});
  app.replaceChildren(...[notice, queueLine(record), el("p", {class: "msg", id: "message", role: "alert", tabIndex: -1}),
    readOnly ? suggestionPanel(record) : reviewPanel(record)].filter(Boolean));
}

function stopPolling() {
  clearTimeout(timer);
  timer = null;
}

function schedule() {
  stopPolling();
  if (current && isActive(current) && !document.hidden) timer = setTimeout(() => refresh(false), 3000);
}

async function refresh(forceDraw) {
  try {
    current = await api("GET", `/characters/${current.id}`);
  } catch (error) {
    const message = document.getElementById("message");
    if (message) say(message, error.message, true);
    schedule();
    if (error.status === 404) stopPolling();
    return;
  }
  if (forceDraw || keyOf(current) !== shownKey) {
    draw();
  } else {
    const line = document.getElementById("line");
    const fresh = queueLine(current);
    if (line && fresh) line.textContent = fresh.textContent;
  }
  schedule();
}

// Pauses while the tab is hidden, and looks again as soon as it's back.
document.addEventListener("visibilitychange", () => {
  if (document.hidden) stopPolling();
  else if (current && shownKey && timer === null && isActive(current)) refresh(false);
});

async function showCharacter(id) {
  try {
    const response = await fetch(`${base}/characters/${id}`);
    if (!response.ok) throw new Error(String(response.status));
    current = await response.json();
  } catch (error) {
    titleEl.textContent = "Character not found";
    app.replaceChildren(el("p", {text: "This link doesn't match a character. If you've lost your link, the owner can find your character by name and send it again."}));
    return;
  }
  draw();
  schedule();
}

/* ---------- The owner page ---------- */

async function showOwner() {
  titleEl.textContent = "Characters";
  stopPolling();
  let list;
  try {
    list = (await api("GET", "/characters")).characters;
  } catch (error) {
    titleEl.textContent = "Not found";
    app.replaceChildren(el("p", {text: "This page doesn't exist."}));
    return;
  }
  const message = el("p", {class: "msg", role: "alert"});
  const pending = list.filter(c => c.status === "suggested");
  const review = c => {
    const path = `/characters/${c.id}`;
    const open = declining === c.id;
    const noteId = `decline-${c.id}`;
    const acted = fn => async () => {
      try {
        await fn();
        declining = null;
        typed.decline = "";
        await showOwner();
      } catch (error) {
        say(message, error.message, true);
      }
    };
    return el("div", {class: "panel"},
      el("h3", {text: `${c.answers.name} (${c.kind === "ai" ? "AI character" : "NPC"})`, style: "margin:0"}),
      answerList(c.answers),
      el("div", {class: "row"},
        el("button", {class: "go", text: "Accept", onclick: acted(() => api("POST", `${path}/accept`))}),
        el("button", {text: "Decline...", "aria-expanded": String(open), onclick: () => { declining = open ? null : c.id; showOwner(); }}),
        el("a", {href: `${pages}/c/${c.id}`, text: "Open or edit"})),
      open ? el("div", {class: "field", style: "margin-top:12px"},
        el("label", {for: noteId, text: "Note for the player"}),
        el("input", {type: "text", id: noteId, maxLength: 500, value: typed.decline, oninput: e => { typed.decline = e.target.value; }}),
        el("div", {class: "row"}, el("button", {class: "danger", text: "Decline with this note",
          onclick: acted(() => api("POST", `${path}/decline`, {note: typed.decline}))}))) : null);
  };
  app.replaceChildren(
    el("div", {class: "row"},
      el("a", {href: `${pages}/new/npc`, text: "New NPC"}),
      el("a", {href: `${pages}/new/ai`, text: "New AI character"})),
    message,
    el("h2", {text: `Suggestions waiting for review (${pending.length})`}),
    ...(pending.length ? pending.map(review) : [el("p", {class: "dim", text: "Nothing waiting."})]),
    el("h2", {text: `All characters (${list.length})`}),
    el("ul", {class: "people"}, ...list.map(c => el("li", {},
      el("a", {href: `${pages}/c/${c.id}`, text: c.answers.name}),
      el("span", {class: "dim small", text: ` ${c.kind}, ${c.status} `}),
      el("a", {class: "small", href: `/create/c/${c.id}`, text: "their private link"})))));
}

/* ---------- Which page is this ---------- */

async function start() {
  try {
    // From the public route, so a wrong owner link gets the same "doesn't exist" page as any other.
    const response = await fetch(`${API}/options`);
    if (!response.ok) throw new Error(String(response.status));
    options = await response.json();
  } catch (error) {
    app.replaceChildren(el("p", {class: "msg err", text: "Couldn't reach the server. Please reload to try again."}));
    return;
  }
  if (ownerMatch) {
    if (ownerMatch[2]) newCharacterForm(ownerMatch[2], false);
    else if (ownerMatch[3]) await showCharacter(ownerMatch[3]);
    else await showOwner();
  } else if (playerMatch) {
    await showCharacter(playerMatch[1]);
  } else {
    const suggest = new URLSearchParams(location.search).get("suggest");
    if (suggest === "npc" || suggest === "ai") newCharacterForm(suggest, true);
    else newCharacterForm("player", false);
  }
}
start();
</script>
</body>
</html>
