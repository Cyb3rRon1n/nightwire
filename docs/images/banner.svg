<svg width="1200" height="300" viewBox="0 0 1200 300" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="300" fill="#14161a"/>

  <!-- rack-shelf texture, matching the sibling banners -->
  <g stroke="#ffffff" stroke-opacity="0.035" stroke-width="1">
    <line x1="0" y1="60" x2="1200" y2="60"/>
    <line x1="0" y1="110" x2="1200" y2="110"/>
    <line x1="0" y1="190" x2="1200" y2="190"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
  </g>

  <!-- large faint pulse trace, watermark on the right -->
  <path d="M900 150 L950 150 L965 90 L985 210 L1000 150 L1150 150" stroke="#ff4fa3" stroke-opacity="0.12" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
  <circle cx="965" cy="90" r="4" fill="#2de1c2" fill-opacity="0.4"/>

  <!-- wire + node mark -->
  <g transform="translate(38,34.5) scale(3.5)">
    <path d="M6 34 L18 34 L24 12 L32 52 L38 30 L58 30" stroke="#ff4fa3" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" fill="none"/>
    <circle cx="24" cy="12" r="4" fill="#2de1c2"/>
  </g>

  <!-- wordmark -->
  <text x="280" y="160" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
        font-size="72" font-weight="700" letter-spacing="6" fill="#f0f2f5">NIGHTWIRE</text>
  <text x="282" y="196" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
        font-size="22" fill="#9aa1ab">A cyberpunk AI game master for real-time tabletop sessions</text>

  <!-- d10, small callout bottom-right, matching this ruleset's actual die -->
  <g transform="translate(1030,222)" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
    <path d="M20 0 L38 11 L38 29 L20 40 L2 29 L2 11 Z" fill="none" stroke="#ff4fa3" stroke-width="2"/>
    <text x="20" y="26" font-size="16" font-weight="700" fill="#2de1c2" text-anchor="middle">10</text>
  </g>
</svg>
