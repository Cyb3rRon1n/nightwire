<text x="24" y="240" font-family="JetBrains Mono, ui-monospace, Menlo, monospace" font-size="18" fill="#2de1c2" xml:space="preserve">[ROLL] Perception (Intellect): 1d10 +3 → 8 vs DC 7 — success</text>

