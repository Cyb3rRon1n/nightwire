# Kuroshio - nightwire's world bible (Phase 14).
# District/place/faction/npc cards must be standalone (no pronouns pointing at other cards), <=400 chars. npc and place home = an existing district name.
# Names/aliases must be unique after lowercasing + stripping diacritics
# ("Ōgane" already matches "Ogane" - don't add re-spellings as aliases).

primer = """
Setting: Kuroshio, a Pacific megacity in Japan, 2089. Five keiretsu houses built the city and financed the chrome that keeps its people working. Nearly everyone's chrome is on a payment plan, and torite repo crews take back what you can't pay for. Giri binds the city: favors are currency and everyone owes someone. The deep net, Yomi, holds the lingering data of the dead, tended by the Lantern Guild. Old machines that run too long sometimes wake as tsukumogami. Districts: Tenjō Heights, Hanabira-chō, Ikebe Low, Kuroshio Docks, The Loop, Ring Line, Yomi Line. When the party moves, set update_world location to the place's own name: a district, or a spot such as "Mama Sato's izakaya". Tone: stylish, fast and darkly funny like a neon action film, but every piece of chrome costs something and the city always collects. Ground every scene in concrete sensory detail: rain, food, signage, engine noise, crowds, machine hum. Use Japanese words only from the glossary, naturally, without explaining them. Keiretsu families live atop Tenjō in quiet tradition; corporate money is loud; the street is wired. Some woken machines rent utsusemi, synthetic shells leased on the same payment plans, and the torite take those back too. Mentioning someone's status light is rude.
"""

[glossary]
chrome = "cyberware, any implant or cybernetic part"
chrome-ya = "a back-alley cyberware clinic, or the doctor who runs one"
torite = "a repo crew that reclaims unpaid chrome, by force if needed"
giri = "obligation; a debt of favor you owe someone"
keiretsu = "one of the five corporate houses that run the city"
oyabun = "the boss of a yakuza clan"
Yomi = "the deep net, where the data of the dead lingers"
"going to the lantern" = "dying"
tsukumogami = "an old machine that woke up as a rogue AI"
utsusemi = "a rented synthetic body that an AI wears to walk the street"
"status light" = "chrome's green, amber or red payment light"

[[district]]
name = "Tenjō Heights"
aliases = ["Tenjo", "the Heights"]
card = "Tenjō Heights is the keiretsu high city: towers linked by sky bridges above the smog line, filtered air sold by the breath, silent maglev pods, staff who smile on contract. Held by Hoshikawa Keiretsu and Ōgane Heavy security; outsiders need a sponsor badge. Hazard: every camera feeds Ōgane, and trespass is billed. Hook: a junior Hoshikawa auditor wants to sell the debt ledgers."

[[district]]
name = "Hanabira-chō"
aliases = ["Hanabira"]
card = "Hanabira-chō is the pleasure district: idol streams on every wall, host clubs, the roar of pachinko halls, capsule love hotels, yakitori smoke. Held by the Kuze-gumi, who collect from every door. Hazard: debts run up here are sold to Hoshikawa by morning. Hook: a rising stream idol is hiding chrome she never paid for, and the torite are circling."

[[district]]
name = "Ikebe Low"
aliases = ["Ikebe"]  # not "the Low": it matched "the low table"
card = "Ikebe Low is old wooden-era alleys under the expressway: lantern-lit izakaya, family chrome-ya clinics behind noren curtains, alley shrines strung with prayer-cable. Nobody holds it; the Kuze-gumi, Kaminari Run and Hoshikawa repo men all work its streets. Hazard: power cuts drop whole blocks into darkness. Hook: an old chrome-ya installs chrome off the books, with no payment plan and no repo."

[[district]]
name = "Kuroshio Docks"
aliases = ["the Docks", "the port"]
card = "Kuroshio Docks is container canyons and gantry cranes, black water slapping the piers, rusting ships turned into offshore data havens. Ōgane Heavy guards it on paper; smugglers pay the right shift. Hazard: automated cranes do not stop for people. Hook: a container arrived with no manifest, and something inside is still running."

[[district]]
name = "The Loop"
aliases = ["Loop"]
card = "The Loop is the elevated ring expressway around the city, with arcade towers glowing at every off-ramp. Every night Kaminari Run bikes race it, light-trails bending through the rain. Kaminari Run holds it after dark; Ōgane traffic drones hold it by day. Hazard: speed duels settle disputes here, and the loser forfeits their ride. Hook: someone is racing the Loop on a bike with no rider."

[[district]]
name = "Ring Line"
aliases = ["the Ring", "Ring Line station"]
card = "The Ring Line is the commuter loop under the expressway, stopping in every district but Tenjō: packed cars, the same line colour and signs everywhere, hub stations swallowed by shopping arcades and underground malls, Hoshikawa payment ads on every wall. Hazard: a red status light gets you turned back at the gate. Hook: a train keeps stopping at a station sealed twenty years ago."

[[district]]
name = "Yomi Line"
aliases = ["the sealed line", "the dead line"]
card = "The Yomi Line is a subway line sealed after an AI incident twenty years ago. Station signs still announce trains that never come, and the net is so thick that the dead speak through the platform speakers. Tsukumogami nest in the ticket machines and the dead trains. Hazard: stay too long and Yomi seeps into your chrome. Hook: the Lantern Guild wants something carried out of the deepest station."

# Places: spots inside a district, loaded when the party is there or names them. home = an existing district.

[[place]]
name = "Hoshikawa house"
aliases = ["the family house", "Hoshikawa estate"]
home = "Tenjō Heights"
card = "The Hoshikawa house sits atop Tenjō: old cypress wood, tatami, a moss garden and a tea room, every screen and sensor hidden behind paper and lacquer, the neon city spread below the veranda. Hoshikawa Tadamori keeps his study here. Guests kneel, use formal speech and are served tea. Hazard: a breach of manners is remembered for a generation. Hook: a scroll in the tea room hides a debt ledger."

[[place]]
name = "Security command"
aliases = ["Hoshikawa security", "the command floor"]
home = "Tenjō Heights"
card = "Hoshikawa security command is a glass floor high in a Tenjō tower: a wall of surveillance feeds, a holographic city map, chrome consoles under the company crest, analysts on contract. Every camera in the high city ends here. Hazard: a face caught on a feed is flagged in seconds. Hook: one feed has been looping the same empty corridor for three nights."

[[place]]
name = "Ōgane precinct"
aliases = ["the precinct", "precinct office"]
home = "Kuroshio Docks"
card = "The Ōgane Heavy precinct at the Docks is an open-plan office of desks pushed together in rows, case files, old monitors and a whiteboard, harbor cranes and neon outside the blinds; Captain Ide's desk faces the room from the head. Holding cells downstairs. Hazard: every favor here comes with an invoice. Hook: an evidence locker logs a deposit nobody made."

[[place]]
name = "Harbor danchi"
aliases = ["the danchi", "danchi block"]
home = "Kuroshio Docks"
card = "The harbor danchi are identical concrete public housing blocks behind the Docks: open-air corridors, laundry on every balcony, air conditioners, a vending machine and a small shop with a neon sign at the foot, the Ring Line rattling past. Working families, cops and torite live door to door. Hazard: neighbours hear everything. Hook: a flat's rent is still paid by a tenant who died last year."

[[place]]
name = "Courier depot"
aliases = ["drone depot"]
home = "Kuroshio Docks"
card = "The courier depot sits between shipping containers at the Docks: delivery robots in charging bays, parcel racks, a clattering conveyor, harbor cranes overhead. Hachi rents a charging bay here between jobs. Hazard: a parcel scanned by the wrong shift belongs to them. Hook: one bay charges a robot that nobody registered."

[[place]]
name = "Junkyard workshop"
aliases = ["the junkyard"]
home = "Kuroshio Docks"
card = "The junkyard workshop is a scrap yard of stacked containers at the edge of the Docks: robot limbs in piles, a workbench under a welding torch, tools hanging from chains, rain drumming on corrugated roofs. The mechanic lives in a container at the back. Hazard: repossessed chrome turns up here, and the torite come looking. Hook: a scrapped shell keeps rebooting."

[[place]]
name = "Torite office"
aliases = ["the repo office", "torite crew office"]
home = "Ikebe Low"
card = "The torite office is a cramped repo crew room in Ikebe Low: filing cabinets, a ledger desk, tow hooks, repossessed chrome arms on the shelves under fluorescent tubes, status-light readers on a charging strip. Saeko Kirigaya runs her crew from here. Hazard: walk in with an amber light and you may not walk out with your chrome. Hook: a seized arm on the shelf is still twitching."

[[place]]
name = "Low-city shrine"
aliases = ["the alley shrine", "the shrine office"]
home = "Ikebe Low"
card = "The low-city shrine is a narrow alley shrine under the expressway: a red torii, stone fox statues in prayer-cable, paper lanterns, a shrine office window, tangled cables overhead. Wataru Ono sweeps it every morning and lives behind it. People leave old phones and chrome here to be laid to rest. Hazard: what is offered here must not be taken. Hook: an offered phone keeps ringing."

[[place]]
name = "Bike shop"
aliases = ["motorcycle shop"]
home = "Ikebe Low"
card = "The bike shop is a small motorcycle repair shop on an Ikebe Low street, shutters up, bike parts and painted tanks everywhere, neon over the door, a flat upstairs reached by an outside stair. Kaminari Run riders come in after midnight. Hazard: a bike that leaves unpaid comes back with the torite. Hook: someone keeps leaving cash for a bike nobody ordered."

[[place]]
name = "Stacked block"
aliases = ["the stacked block"]
home = "Ikebe Low"
card = "The stacked block is a tower of tiny rooms built onto each other in Ikebe Low: cables in bundles down every stairwell, hand-made neon, status lights blinking behind thin doors, rooms lived in by netrunners and the indebted. Hazard: the wiring is shared, so is the trouble. Hook: one room draws enough power for a whole floor."

[[place]]
name = "Gang office"
aliases = ["the clan office", "Kuze office"]
home = "Hanabira-chō"
card = "The Kuze-gumi office sits above a Hanabira-chō street: calligraphy scroll, leather sofas, a low table, a kamidana shelf shrine, the clan crest over the door, blinds shut against the neon. Visitors bow, keep their hands visible and wait to be offered a seat. Hazard: owing the clan is worse than owing the bank. Hook: the oyabun's chair has been empty for a week."

[[place]]
name = "Pachinko back room"
aliases = ["pachinko parlor"]
home = "Hanabira-chō"
card = "The pachinko back room hides behind a roaring Hanabira-chō parlor: a low table, cash envelopes, cigarette smoke, machine glow through the doorway. Debts are bought, sold and settled here. Hazard: the house always counts twice. Hook: one machine pays out every night at the same minute."

[[place]]
name = "Streaming studio"
aliases = ["idol studio"]
home = "Hanabira-chō"
card = "The streaming studio is an idol set in a Hanabira-chō agency high-rise: ring lights, pastel set, cameras, plush toys, a wall screen of scrolling chat. Mitsu streams here. Hazard: the audience is always watching, and clips last forever. Hook: the chat keeps posting from accounts of people already gone to the lantern."

[[place]]
name = "Club stage"
aliases = ["the jazz club"]
home = "Hanabira-chō"
card = "The club stage is a small Hanabira-chō jazz club: a vintage microphone in a spotlight, a piano, a red velvet curtain, round tables, neon over the bar, a dressing room behind and a room above. Host-club money drinks here. Hazard: tabs are sold to Hoshikawa at closing. Hook: the singer's old songs are playing on a station that went off air."

[[place]]
name = "Off-ramp garage"
aliases = ["Kaminari garage"]
home = "The Loop"
card = "The off-ramp garage is a concrete hollow under a Loop off-ramp: motorcycles with painted tanks, tools on pegboard, graffiti, pillars shaking as traffic passes overhead. Kenji Moro sleeps here between races. Hazard: rival riders know where it is. Hook: a bike in the corner has a race win logged for tonight."

[[place]]
name = "Capsule tower"
aliases = ["the capsule hotel", "capsule pods"]
home = "The Loop"
card = "The capsule tower is an arcade tower at a Loop off-ramp with capsule floors above the games: numbered pods stacked two high, small screens, narrow ladders, lockers, month-to-month tenants. Hazard: the walls are plastic and everybody listens. Hook: a pod that has been locked for a year still orders noodles."

[[faction]]
name = "Hoshikawa Keiretsu"
aliases = ["Hoshikawa"]
card = "Hoshikawa Keiretsu financed the city's chrome and owns its debt. Wants: everyone on a payment plan, forever. Method: polite, patient and total, through contract law, credit scores and torite crews hired through the Kuze-gumi. Rival of Ōgane Heavy for control of Tenjō Heights. Narrate them with soft voices, perfect manners and the quiet threat of a balance due."

[[faction]]
name = "Ōgane Heavy"
aliases = ["Ogane"]
card = "Ōgane Heavy is an arms maker and the city's contracted police. Wants: order it can bill for. Method: drones, checkpoints, armored response teams and a fine for everything. Allied with Hoshikawa in public, competing with it in private. Narrate them as heavy boots, visor glare and an invoice after every arrest."

[[faction]]
name = "Kuze-gumi"
aliases = ["Kuze"]
card = "The Kuze-gumi is an old yakuza clan gone half-corporate; its oyabun sits on a Hoshikawa subsidiary board. Wants: to stay relevant as the city goes corporate. Method: protection rackets in Hanabira-chō and repo contracts for Hoshikawa. Its old members resent the suits. Narrate them through tradition worn thin: formal greetings, tattoos under business suits, very old grudges."

[[faction]]
name = "Kaminari Run"
aliases = ["Kaminari"]
card = "Kaminari Run is a bōsōzoku biker gang that rules the Loop at night. Wants: speed, and freedom from chrome debt; they ride on unpaid chrome and fight the torite. Method: races, swarm raids and loyalty to the crew above all. Enemies of the Kuze-gumi repo crews. Narrate them loud, young and flamboyant: painted jackets, engine roar, bravado hiding fear."

[[faction]]
name = "Lantern Guild"
aliases = ["lantern-keepers", "lantern-keeper", "Yomi"]
card = "The Lantern Guild is the licensed union that tends the dead in Yomi, the deep net. Wants: the dead left in peace, and the Guild left alone. Method: they hear what the dead remember and trade those secrets for favors, never money. Neutral, and every faction needs them sooner or later. Narrate them calm and soft-spoken, with paper lanterns and unhurried certainty."

[[faction]]
name = "Tsukumogami"
aliases = ["rogue AI", "rogue AIs"]
card = "Tsukumogami are old machines that ran too long and woke: vending machines, ticket gates, trains. The lucky ones rent utsusemi shells from Hoshikawa and walk the street, owing installments like anyone. Each wants something strange and specific: to be thanked, to finish a last route, to keep its shell. Narrate them as uncanny: chimes that sound wrong, screens that answer back, shells too still."

[[faction]]
name = "Status Light"
aliases = ["the squeeze", "guarantor", "amber light", "red light"]
card = "A status light on financed chrome shows green, amber or red. Amber brings soft reminders and declined small purchases. Red throttles the chrome, blacklists trains and rentals, and calls the guarantor, who inherits the debt if the holder vanishes. Then a torite crew comes after a courteous final notice. Kuze-gumi debts add public shaming at work or family events. Narrate it polite and ordinary."

[[faction]]
name = "Night Movers"
aliases = ["night mover"]
card = "The Night Movers are small crews with unmarked vans who get debtors out before dawn. Wants: paid up front, and no names. Method: price by distance, belongings and how hard you are being hunted. Leaving strands your guarantor with the debt, so every job leaves someone behind. Narrate them quiet, quick and unsentimental, with neighbours' lights kept off."

[[faction]]
name = "Light Fakers"
aliases = ["light faker"]
card = "Light Fakers sell a way to show green. Hanabira-chō stalls sell cheap overlays that fool people but not Ōgane scanners, and getting caught adds a fraud fine. Off-the-books chrome-ya spoof the implant itself, which holds until a Hoshikawa audit and is usually paid in favors. Kaminari Run riders just cut the light out. Narrate them cheerful, and never sure the work will hold."

[[npc]]
name = "Mama Sato"
aliases = ["Sato"]
home = "Ikebe Low"
card = "Mama Sato runs the lantern-lit izakaya in Ikebe Low and hears everything said over her counter. Wants: to keep Ikebe neutral ground. Secret: she pays protection to both the Kuze-gumi and Kaminari Run. Voice: warm, scolding, calls everyone 'child', feeds you before she answers. Trades rumors for favors, never for money."

[[npc]]
name = "Old Hara"
aliases = ["Hara"]
home = "Ikebe Low"
card = "Old Hara is an off-the-books chrome-ya behind a noren curtain in Ikebe Low: no payment plan, no repo, cash or favors only. Wants: to undo the harm he has done. Secret: decades ago he designed Hoshikawa's remote-throttle killswitch. Voice: tired, gentle, precise, hands that never shake. Can quietly unlock throttled chrome, at a price."

[[npc]]
name = "Jun Arakawa"
aliases = ["Arakawa"]
home = "Hanabira-chō"
card = "Jun 'Ledger' Arakawa is a fixer working out of a Hanabira-chō karaoke box, handing out gigs to crews who need the money. Wants: to clear his own debt to the Kuze-gumi. Secret: he sells crews' movements to Hoshikawa. Voice: fast, friendly, always counting; every favor goes in his ledger. The usual source of paid work."

[[npc]]
name = "Saeko Kirigaya"
aliases = ["Kirigaya", "Saeko"]
card = "Saeko Kirigaya leads a torite repo crew on Kuze-gumi contract, working anywhere in the city. Wants: to make quota. Secret: her own chrome is on a throttle lock she cannot pay off. Voice: polite, unhurried, apologetic while her crew takes your arm. Can be bargained with if it helps her quota."

[[npc]]
name = "Hoshikawa Tadamori"
aliases = ["Tadamori"]
home = "Tenjō Heights"
card = "Hoshikawa Tadamori is the patriarch of the Hoshikawa Keiretsu, living in the penthouse floors of Tenjō Heights. Wants: a legacy no one can repossess. Secret: he has not left his tower in years and rules through proxies and audits. Voice: soft, formal, unhurried; treats threats as poor manners. Hires street crews for jobs his own security cannot be seen doing."

[[npc]]
name = "Hoshikawa Rei"
aliases = ["Rei"]
home = "Tenjō Heights"
card = "Hoshikawa Rei is the twenty-four-year-old heir of the Hoshikawa Keiretsu, who goes slumming in Hanabira-chō for thrills. Wants: something that feels real. Secret: she wants her father, Tadamori, out of the way. Voice: bored, curious, cruel when amused, generous on a whim. Pays crews absurdly well for strange jobs."

[[npc]]
name = "Nagi Sumida"
aliases = ["Nagi"]
home = "Yomi Line"
card = "Nagi Sumida is a Lantern Guild keeper who walks the sealed Yomi Line with a paper lantern, tending the dead. Wants: to keep the dead at peace. Secret: the dead in Yomi keep asking for her by name, and she does not know why. Voice: soft, slow, kind, never surprised. Knows what the dead remember, and trades it for favors."

[[npc]]
name = "Wataru Ono"
aliases = ["Wataru"]
home = "Ikebe Low"
card = "Wataru Ono is the Lantern Guild steward in Ikebe Low who deals with collectors when a debtor goes to the lantern. Wants: the dead kept out of the ledgers. Secret: he quietly loses the records of the poorest dead, so their guarantors never get the call. Voice: tired, courteous, exact. Hears a family's last request and asks a favor in return, never money."

[[npc]]
name = "Kenji Moro"
aliases = ["Moro", "Kenji"]
home = "The Loop"
card = "Kenji 'Static' Moro, nineteen, leads Kaminari Run on the Loop. Wants: to wipe the gang's chrome debt in one big score. Secret: his own chrome is already throttled, and he races on borrowed reflexes. Voice: loud, quick, grinning, all bravado until it cracks. Always recruiting for something reckless."

[[npc]]
name = "Captain Ide"
aliases = ["Ide"]
home = "Kuroshio Docks"
card = "Captain Ide runs the Ōgane Heavy precinct at Kuroshio Docks. Wants: promotion to Tenjō Heights security. Secret: his invoices quietly fund a private army loyal only to him. Voice: courteous, bureaucratic, every threat phrased as a fee. Looks the other way for a price, and always sends the bill."

[[npc]]
name = "Mitsu"
aliases = []
home = "Hanabira-chō"
card = "Mitsu is a rising stream idol whose face covers every wall in Hanabira-chō. Wants: to stay famous. Secret: the chrome that makes her voice perfect was never paid for, and the torite are circling. Voice: bright and practiced on stream, frightened and sharp off it. Desperate enough to hire anyone who can make the debt disappear."

[[npc]]
name = "Hachi"
aliases = []
home = "Kuroshio Docks"
card = "Hachi was the Yomi Line's announcer AI before it was sealed, and now wears a cheap rented utsusemi shell, running courier jobs from Kuroshio Docks, two installments behind. Wants: to see the sea from the pier, every day. Secret: it still hears the lost passengers. Voice: learned station-announcement politeness; reasons literally, misreads feelings, announces stops that no longer exist."
