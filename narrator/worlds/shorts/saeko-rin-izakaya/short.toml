# Saeko's day film, scene 4, re-planned in the look-book grammar: four slow mostly-wide shots, ~38 s. Saeko (C1) and Rin (C2) at Mama Sato's izakaya, night.
# Backs, profiles and two small figures; the old 24 s pilot had close-ups and an over-the-shoulder pair. Room facts below still apply.
# Room in metres from design-data/mama-satos-izakaya/play.png: the counter runs along X, guests sit on the
# -Y side facing +Y (facing 90), the bottle shelf is +Y behind the counter, the door (noren) is in the -X wall.
# Low counter (top 0.85 m), 0.4 m box stools; seated C1 has hips at stool height (tool drops `sit`).
# Block `at` is the bottom centre. Figure keys are [t, x, y, facing] on the shared timeline.
title = "Resting"
logline = "Saeko's chrome hand locks at Mama Sato's counter. Rin can unlock it, for a price."
place = "mama-satos-izakaya"
style = "anime screenshot coloring, cel shading, thick outlines, night, warm paper-lantern light with pink rim light and cyan backlight, high contrast, bloom, steam, mature gritty cyberpunk"
budget_usd = 25.0
model = "seedance-2.0-fast"
line_rule = "C1 (Saeko) is screen-right of C2 (Rin) in every shot from S01's two-shot on"
retry_cap = 2
avoid = ["open jacket", "cleavage"]
beats = [
  "strange event: C1's chrome hand locks shut around a sake cup, an amber light blinking on its wrist (S01)",
  "immediate goal: C1 hides the hand; C2 arrives beside her and sees it (S02)",
  "unbreakable rule: nobody names a status light - C2 says 'jammed', C1 says 'resting' (S02)",
  "reveal: C2's price is her own name off C1's repo list, and C1 already knew (S03)",
  "open question: C1 turns the data jack over and does not connect it (S04)",
]

