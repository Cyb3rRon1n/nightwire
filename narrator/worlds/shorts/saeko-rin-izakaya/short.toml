# Pilot short: Saeko Kirigaya (C1) and Rin Kageyama (C2) at Mama Sato's izakaya, night, ~24 s.
# Room in metres from design-data/mama-satos-izakaya/play.png: the counter runs along X, guests sit on the
# -Y side facing +Y (facing 90), the bottle shelf is +Y behind the counter, the door (noren) is in the -X wall.
# Low counter (top 0.85 m), 0.4 m box stools; seated C1 has hips at stool height (tool drops `sit`).
# Block `at` is the bottom centre. Figure keys are [t, x, y, facing] on the shared timeline.
title = "Resting"
logline = "Saeko's chrome hand locks at Mama Sato's counter. Rin can unlock it, for a price."
place = "mama-satos-izakaya"
style = "anime screenshot coloring, cel shading, thick outlines, night, warm paper-lantern light with pink rim light and cyan backlight, high contrast, bloom, steam, rain heard beyond the noren, mature gritty cyberpunk"
budget_usd = 25.0
beats = [
  "strange event: C1's chrome hand locks shut around a sake cup, an amber light blinking on its wrist (S01)",
  "immediate goal: C1 covers the hand before the newcomer sees it; C2 walks straight to her (S01)",
  "unbreakable rule: nobody names a status light - C2 says 'stuck', C1 says 'resting' (S02)",
  "ticking clock: the amber blink quickens while C1 bargains (S03)",
  "reveal: C2's price is her own name off C1's repo list, and C1 already knew (S03)",
  "open question: C1 turns the cable plug over and does not plug it in (S03)",
]

