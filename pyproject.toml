[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nightwire"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.13",
    "ollama>=0.6.2",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24", "pillow>=10", "numpy>=1.26", "opencv-python-headless", "scipy"]
design = ["pillow>=10", "numpy>=1.26", "opencv-python-headless", "scipy", "dghs-imgutils", "onnxruntime"]
qa = ["dghs-imgutils", "onnxruntime"]
loops = ["onnxruntime", "torch", "sam-2 @ git+https://github.com/facebookresearch/sam2.git"]  # tools/loop_still: matte, LaMa, SAM 2 region masks (CPU)

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]   # tests import shared helpers as tests.<module>; plain `pytest` (CI) needs the root on sys.path
asyncio_mode = "auto"

[tool.setuptools.packages.find]
include = ["ruleset", "engine", "server", "narrator", "tools", "tools.*"]

[tool.setuptools.package-data]
narrator = ["worlds/*.toml", "worlds/designs/*.toml", "worlds/place_art/*.jpg", "worlds/character_art/*.jpg",
            "worlds/shorts/*/*.toml", "worlds/shorts/*/shots/*.toml"]
tools = ["design_picker.html", "design_review.html", "image_studio.html", "character_creator.html", "poses/*.png", "shorts/page.html"]
