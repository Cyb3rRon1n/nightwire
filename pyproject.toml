[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nightwire"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.13",
    "ollama>=0.6.2",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24", "pillow>=10", "numpy>=1.26"]
design = ["pillow>=10", "numpy>=1.26", "dghs-imgutils", "onnxruntime"]
qa = ["dghs-imgutils", "onnxruntime"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.setuptools.packages.find]
include = ["ruleset", "engine", "server", "narrator", "tools"]

[tool.setuptools.package-data]
narrator = ["worlds/*.toml", "worlds/designs/*.toml", "worlds/place_art/*.jpg", "worlds/character_art/*.jpg"]
tools = ["design_picker.html", "design_review.html", "image_studio.html", "poses/*.png"]
